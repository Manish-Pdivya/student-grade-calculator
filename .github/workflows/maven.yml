
name: Maven Build and Docker Hub Deployment

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      # STEP 1: Checkout GitHub repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # STEP 2: Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # STEP 3: Run Maven clean and tests
      - name: Maven Clean and Test
        run: mvn clean test

      # STEP 4: Build Maven package
      - name: Maven Package
        run: mvn package

      # STEP 5: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # STEP 6: Login to Docker Hub
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # STEP 7: Build and push Docker image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/student-grade-calculator:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/student-grade-calculator::${{ github.sha }}